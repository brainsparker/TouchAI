name: UI Preview Native Validation

on:
    pull_request:
        types:
            - labeled

permissions:
    contents: read
    pull-requests: read

jobs:
    record:
        name: Validate ${{ matrix.platform }}
        if: github.event.label.name == 'ui-preview-native-validation'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux
                      os: ubuntu-24.04
                      binary: TouchAI
                    - platform: macos
                      os: macos-15
                      binary: TouchAI
                    - platform: windows
                      os: windows-latest
                      binary: TouchAI.exe
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        env:
            CARGO_TARGET_DIR: ${{ github.workspace }}/.ui-preview-target
            TOUCHAI_E2E: '1'
            UI_PREVIEW_PLATFORM: ${{ matrix.platform }}
        steps:
            - name: Check out the pull request
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

            - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: apps/desktop/src-tauri -> ../../../.ui-preview-target

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Linux dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential \
                    curl \
                    ffmpeg \
                    file \
                    fonts-noto-cjk \
                    imagemagick \
                    libayatana-appindicator3-dev \
                    libglib2.0-dev \
                    librsvg2-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    libxdo-dev \
                    openbox \
                    picom \
                    pkg-config \
                    wget \
                    x11-utils \
                    x11-xserver-utils \
                    xdotool \
                    xvfb

            - name: Configure the hosted display (macOS)
              if: matrix.platform == 'macos'
              run: |
                  swift .github/ui-preview/macos-display.swift --list
                  swift .github/ui-preview/macos-display.swift --configure-hosted

            - name: Configure the hosted display (Windows)
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  ./.github/ui-preview/configure-display.ps1 -List
                  ./.github/ui-preview/configure-display.ps1

            - name: Build the desktop app
              run: pnpm tauri build --debug --no-bundle --features ui-preview-webdriver

            - name: Collect the outline
              if: matrix.platform != 'linux'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ env.CARGO_TARGET_DIR }}/debug/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: node .github/ui-preview/explore.mjs

            - name: Collect the outline (Linux)
              if: matrix.platform == 'linux'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ env.CARGO_TARGET_DIR }}/debug/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  UI_PREVIEW_DISPLAY_WIDTH: '1920'
                  UI_PREVIEW_DISPLAY_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_WIDTH: '1920'
                  UI_PREVIEW_STAGE_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_TOP: '40'
                  UI_PREVIEW_SCALE_FACTOR: '1'
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: |
                  xvfb-run -a --server-args='-screen 0 1920x1080x24' \
                    .github/ui-preview/with-display.sh \
                    node .github/ui-preview/explore.mjs

            - name: Plan the deterministic preview
              env:
                  GH_TOKEN: ${{ github.token }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
              run: node .github/ui-preview/plan.mjs

            - name: Install macOS recording dependencies
              if: matrix.platform == 'macos'
              run: brew install ffmpeg

            - name: Install Windows recording dependencies
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
                    choco install ffmpeg -y --no-progress
                  }
                  ffmpeg -version | Select-Object -First 1

            - name: Record the native preview
              if: matrix.platform != 'linux'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ env.CARGO_TARGET_DIR }}/debug/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_TITLE: ${{ github.event.pull_request.title }}
                  UI_PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  UI_PREVIEW_TRIGGER: native validation
                  UI_PREVIEW_SEED: '1'
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: node .github/ui-preview/record.mjs

            - name: Record the native preview (Linux)
              if: matrix.platform == 'linux'
              env:
                  UI_PREVIEW_APP_BINARY: ${{ env.CARGO_TARGET_DIR }}/debug/${{ matrix.binary }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_TITLE: ${{ github.event.pull_request.title }}
                  UI_PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  UI_PREVIEW_TRIGGER: native validation
                  UI_PREVIEW_SEED: '1'
                  UI_PREVIEW_DISPLAY_WIDTH: '1920'
                  UI_PREVIEW_DISPLAY_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_WIDTH: '1920'
                  UI_PREVIEW_STAGE_HEIGHT: '1080'
                  UI_PREVIEW_STAGE_TOP: '40'
                  UI_PREVIEW_SCALE_FACTOR: '1'
                  TOUCHAI_APP_ROOT: ${{ runner.temp }}/ui-preview-app-root
              run: |
                  xvfb-run -a --server-args='-screen 0 1920x1080x24' \
                    .github/ui-preview/with-display.sh node .github/ui-preview/record.mjs

            - name: Upload evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ui-preview-native-validation-${{ matrix.platform }}
                  if-no-files-found: warn
                  retention-days: 14
                  path: |
                      ui-preview-out/manifest.json
                      ui-preview-out/evidence

    publish:
        name: Publish the validation comment
        needs:
            - record
        # Validation-only: maintainers add the label after review, and the
        # publisher runs the scripts from the same branch it just recorded.
        # The production trigger is ui-preview.yml, which never runs head code
        # in a job that holds a token.
        if: >-
            always() &&
            github.event.label.name == 'ui-preview-native-validation' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Check out the validation scripts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              continue-on-error: true
              with:
                  pattern: ui-preview-native-validation-*
                  path: ui-preview-out/platforms
                  merge-multiple: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Publish the comment as the Actions bot
              env:
                  GH_TOKEN: ${{ github.token }}
                  UI_PREVIEW_BOT_LOGIN: github-actions[bot]
                  UI_PREVIEW_TOKEN: ${{ secrets.UI_PREVIEW_TOKEN }}
                  UI_PREVIEW_OUT: ${{ github.workspace }}/ui-preview-out
                  UI_PREVIEW_PLATFORMS: linux,macos,windows
                  UI_PREVIEW_PR: ${{ github.event.pull_request.number }}
                  UI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
                  UI_PREVIEW_TRIGGER: native validation
                  UI_PREVIEW_REPOSITORY_ID: ${{ github.event.repository.id }}
                  UI_PREVIEW_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
              run: node .github/ui-preview/publish.mjs
